# Deploy naar GitHub Pages via Actions i.p.v. de klassieke pages-builder.
# Waarom: de klassieke builder heeft een harde time-out van ~10 minuten en
# faalde daarop twee keer (6 aug 2026) — de site is ~478 MB aan statische
# JSON's. Deze route heeft die cap niet en doet verder exact hetzelfde:
# alles uploaden zoals het in de repo staat.
# Vereist eenmalig: Settings → Pages → Source = "GitHub Actions".
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
